name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_TYPE: Release
  PRODUCT: PitchShifter
  MANUAL: PitchShifter-Manual.pdf

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(PitchShifter VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DPS_BUILD_TESTS=ON
          elif [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build -G "Visual Studio 17 2022" -A x64 -DPS_BUILD_TESTS=ON
          else
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DPS_BUILD_TESTS=ON
          fi

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4

      - name: Validate (pluginval)
        shell: bash
        run: |
          ART="build/${PRODUCT}_artefacts/$BUILD_TYPE"
          if [ "$RUNNER_OS" == "macOS" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
            unzip -q pv.zip
            PV=pluginval.app/Contents/MacOS/pluginval
          elif [ "$RUNNER_OS" == "Windows" ]; then
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip
            7z x -y pv.zip > /dev/null
            PV=./pluginval.exe
          else
            curl -sSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Linux.zip
            unzip -q pv.zip
            PV="xvfb-run -a ./pluginval"
          fi
          $PV --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$ART/VST3/$PRODUCT.vst3"

      - name: Audio pass-through test (VST3)
        shell: bash
        run: |
          ART="build/${PRODUCT}_artefacts/$BUILD_TYPE"
          if [ "$RUNNER_OS" == "Windows" ]; then
            "build/AudioPassTest_artefacts/$BUILD_TYPE/AudioPassTest.exe" "$ART/VST3/$PRODUCT.vst3"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            "build/AudioPassTest_artefacts/$BUILD_TYPE/AudioPassTest.app/Contents/MacOS/AudioPassTest" "$ART/VST3/$PRODUCT.vst3"
          else
            xvfb-run -a "build/AudioPassTest_artefacts/$BUILD_TYPE/AudioPassTest" "$ART/VST3/$PRODUCT.vst3"
          fi

      - name: Audio Unit validation and pass-through test (macOS)
        if: runner.os == 'macOS'
        run: |
          ART="build/${PRODUCT}_artefacts/$BUILD_TYPE"
          codesign --force --deep --sign - "$ART/AU/$PRODUCT.component"
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/$PRODUCT.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a | grep -i "Tico" || true
          auval -strict -v aufx Tpsh Tico
          "build/AudioPassTest_artefacts/$BUILD_TYPE/AudioPassTest.app/Contents/MacOS/AudioPassTest" "AU:aufx,Tpsh,Tico"


      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ART="build/${PRODUCT}_artefacts/$BUILD_TYPE"
          for b in "$ART/AU/$PRODUCT.component" "$ART/VST3/$PRODUCT.vst3" "$ART/Standalone/$PRODUCT.app"; do
            codesign --force --deep --sign - "$b"
          done

          mkdir -p pkgroot/au/Library/Audio/Plug-Ins/Components \
                   pkgroot/vst3/Library/Audio/Plug-Ins/VST3 \
                   pkgroot/app/Applications
          cp -R "$ART/AU/$PRODUCT.component"   pkgroot/au/Library/Audio/Plug-Ins/Components/
          cp -R "$ART/VST3/$PRODUCT.vst3"      pkgroot/vst3/Library/Audio/Plug-Ins/VST3/
          cp -R "$ART/Standalone/$PRODUCT.app" pkgroot/app/Applications/

          ID=com.ticcoross.pitchshifter
          pkgbuild --root pkgroot/au      --identifier $ID.au      --version $VERSION --install-location / au.pkg
          pkgbuild --root pkgroot/vst3    --identifier $ID.vst3    --version $VERSION --install-location / vst3.pkg
          pkgbuild --root pkgroot/app     --identifier $ID.app     --version $VERSION --install-location / app.pkg

          cat > distribution.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>PitchShifter $VERSION</title>
            <options customize="always" require-scripts="false" hostArchitectures="arm64,x86_64"/>
            <domains enable_localSystem="true"/>
            <choices-outline>
              <line choice="au"/><line choice="vst3"/><line choice="app"/>
            </choices-outline>
            <choice id="au" title="Audio Unit"><pkg-ref id="$ID.au"/></choice>
            <choice id="vst3" title="VST3"><pkg-ref id="$ID.vst3"/></choice>
            <choice id="app" title="Standalone app"><pkg-ref id="$ID.app"/></choice>
            <pkg-ref id="$ID.au">au.pkg</pkg-ref>
            <pkg-ref id="$ID.vst3">vst3.pkg</pkg-ref>
            <pkg-ref id="$ID.app">app.pkg</pkg-ref>
          </installer-gui-script>
          EOF
          mkdir -p dist
          productbuild --distribution distribution.xml --package-path . "dist/$PRODUCT-$VERSION-macOS.pkg"
          cp "$MANUAL" dist/

      # ---------------- Windows: VST3 + exe, Inno Setup installer + zip ----------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $art = "build/$env:PRODUCT`_artefacts/$env:BUILD_TYPE"
          New-Item -ItemType Directory -Force -Path stage/VST3, dist | Out-Null
          Copy-Item -Recurse "$art/VST3/$env:PRODUCT.vst3" stage/VST3/
          Copy-Item "$art/Standalone/$env:PRODUCT.exe" stage/
          Copy-Item $env:MANUAL stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$env:PRODUCT-$env:VERSION-Windows.zip"

          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
            $env:Path += ";C:\Program Files (x86)\Inno Setup 6"
          }
          iscc /DMyVersion=$env:VERSION "/O$PWD\dist" packaging/windows/installer.iss
          Copy-Item $env:MANUAL dist/

      # ---------------- Linux: VST3 + standalone tarball ----------------
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ART="build/${PRODUCT}_artefacts/$BUILD_TYPE"
          STAGE="$PRODUCT-$VERSION-Linux"
          mkdir -p "$STAGE" dist
          cp -R "$ART/VST3/$PRODUCT.vst3" "$STAGE/"
          cp "$ART/Standalone/$PRODUCT" "$STAGE/"
          cp "$MANUAL" packaging/linux/install.sh "$STAGE/"
          chmod +x "$STAGE/install.sh" "$STAGE/$PRODUCT"
          tar czf "dist/$STAGE.tar.gz" "$STAGE"
          cp "$MANUAL" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRODUCT }}-${{ env.VERSION }}-${{ matrix.name }}
          path: dist/*

  release:
    # Publishes a release for the version in CMakeLists.txt on every push to main (or a v* tag).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=$(sed -n 's/^project(PitchShifter VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: PitchShifter ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body: |
            PitchShifter ${{ env.VERSION }} by Ticco Ross.
            - macOS: universal .pkg (Audio Unit, VST3, standalone app). Not signed by Apple; the first time, right-click it and choose Open.
            - Windows: Setup .exe or .zip (VST3, standalone).
            - Linux: .tar.gz, run install.sh.
            The user manual (PitchShifter-Manual.pdf) is attached.
